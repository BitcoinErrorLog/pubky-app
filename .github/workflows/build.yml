name: Build

on:
  merge_group:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**' # Run on PRs targeting any branch
  # Enable manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check NextJS Build
    runs-on: ubuntu-latest
    # Last-10 median was 47 min because paykit-wasm-smoke held the event loop
    # after "passed". Post-fix remainder is install (~40s) + next build (~3 min)
    # + server smoke (~2s) ≈ 5 min; 10 min is 2× that, not 2× the hang.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Smoke test vendored Locks SDK
        run: node scripts/locks-sdk-smoke.mjs

      - name: Smoke test vendored paykit-wasm messaging binding
        run: node scripts/paykit-wasm-smoke.mjs

      - name: Build prod
        run: npm run build

      - name: Smoke test production server
        run: |
          SERVER_LOG="$(mktemp)"

          #PUBKY runtime variables
          export PUBKY_RUNTIME_ENV="staging"
          export PUBKY_RUNTIME_TESTNET="false"
          export PUBKY_RUNTIME_HOMESERVER="ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy"
          export PUBKY_RUNTIME_HOMESERVER_URL="https://homeserver.staging.pubky.app"
          export PUBKY_RUNTIME_NEXUS_URL="https://nexus.staging.pubky.app"
          export PUBKY_RUNTIME_CDN_URL="https://nexus.staging.pubky.app/static"
          export PUBKY_RUNTIME_HOMEGATE_URL="https://homegate.staging.pubky.app"
          export PUBKY_RUNTIME_PKARR_RELAYS='["https://pkarr.pubky.app","https://pkarr.pubky.org"]'
          export PUBKY_RUNTIME_DEFAULT_HTTP_RELAY="https://httprelay.staging.pubky.app/inbox"

          npm run start > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          PORT=3000
          MAX_WAIT=120
          WAIT_INTERVAL=2
          ELAPSED=0

          while ! curl -fsS "http://localhost:${PORT}/" > /dev/null; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Production server exited unexpectedly (PID ${SERVER_PID})."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Production server did not become ready within ${MAX_WAIT}s."
              echo "--- server log ---"
              cat "$SERVER_LOG"
              exit 1
            fi
            echo "Waiting for http://localhost:${PORT}/ ... (${ELAPSED}s)"
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
          done

          echo "Production server is ready."

      - name: Upload Next build for launch-e2e
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/shop-')
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  launch-e2e:
    name: launch-e2e
    needs: build
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/shop-')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    # Subset ceiling is 8 min; first-run timeout is 2× that until a median exists.
    timeout-minutes: 16
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: next-build-artifact

      - name: Place .next
        shell: bash
        run: |
          set -euo pipefail
          ls -la next-build-artifact | head
          if [ -d next-build-artifact/.next ]; then
            mv next-build-artifact/.next .next
          elif [ -f next-build-artifact/BUILD_ID ]; then
            mv next-build-artifact .next
          else
            echo "Unexpected next-build artifact layout"
            find next-build-artifact -maxdepth 3 | head -80
            exit 1
          fi
          test -f .next/BUILD_ID
          echo "BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Run launch-critical Chromium suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          LAUNCH_E2E_BASE_URL: http://127.0.0.1:3000
          LAUNCH_E2E_SERVICE_URL: https://staging-api.pubky.app
          LAUNCH_E2E_SELLER_SECRET_HEX: ${{ secrets.LAUNCH_E2E_SELLER_SECRET_HEX }}
        run: bash scripts/ci-launch-e2e.sh

      - name: Upload launch-e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-e2e-log
          path: launch-e2e-results.json
          if-no-files-found: ignore
          retention-days: 7
