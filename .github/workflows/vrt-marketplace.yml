name: Marketplace VRT

on:
  pull_request:
    branches:
      - 'release/shop-*'

jobs:
  vrt-marketplace:
    name: vrt-marketplace
    runs-on: ubuntu-latest
    # Ubuntu full-suite VRT median is 8.4 min; marketplace-only chromium+firefox
    # should sit under that. 20 min is ~2× plus Playwright install headroom.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Playwright browsers path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: vrt-marketplace-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            vrt-marketplace-playwright-${{ runner.os }}-
            vrt-playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Install Playwright system dependencies
        if: steps.playwright-browsers-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      - name: Run marketplace visual regression tests
        env:
          VRT_BROWSERS: chromium,firefox
          VRT_REPORT_DIR: ${{ runner.temp }}/vrt-marketplace-ci
        run: bash scripts/ci-vrt-marketplace.sh

      - name: Save Playwright browsers cache
        if: always() && steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browsers-cache.outputs.cache-primary-key }}

      - name: Upload newly recorded Linux baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-marketplace-linux-baselines
          path: ${{ runner.temp }}/vrt-marketplace-ci/new-linux-baselines/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload VRT report and attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-marketplace-report
          path: |
            ${{ runner.temp }}/vrt-marketplace-ci/report.json
            .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
